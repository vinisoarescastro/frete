<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Entrar | Calculadora de Fretes</title>
<link rel="icon" href="/assets/logo-fretes.png" type="image/png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/icons.css">
<script src="/assets/js/theme.js"></script>
<style>.login__logo{display:inline-flex;background:#fff;border-radius:var(--radius-md);padding:.5rem .75rem}.login__logo img{height:2.5rem;width:auto;display:block}</style>
</head>
<body>
<div class="login">
  <div class="login__bg" aria-hidden="true"></div>
  <div class="login__theme">
    <button type="button" class="ds-icon-btn" data-theme-toggle aria-label="Usar tema escuro"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#moon"/></svg></button>
  </div>
  <main class="login__main" id="conteudo">
    <div class="login__card">
      <aside class="login__aside">
        <div class="login__brand"><span class="login__logo"><img src="/assets/logo-fretes.png" alt="Vertice Fretes" width="582" height="197"></span></div>
        <div>
          <h2 class="login__headline">Orçamentos de frete em poucos cliques.</h2>
          <ul class="login__points">
            <li><svg width="16" height="16" aria-hidden="true"><use href="/assets/icons.svg#check"/></svg>Distâncias calculadas no mapa</li>
            <li><svg width="16" height="16" aria-hidden="true"><use href="/assets/icons.svg#check"/></svg>Preço, margem e lucro na hora</li>
            <li><svg width="16" height="16" aria-hidden="true"><use href="/assets/icons.svg#check"/></svg>Acesso protegido por senha</li>
          </ul>
        </div>
      </aside>
      <div class="login__side">
        <form method="post" action="/login" class="stack" autocomplete="on">
          <div class="login__head">
            <h1 class="login__title">Bem-vindo</h1>
            <p class="login__sub">Informe a senha para continuar.</p>
          </div>
          {{MSG}}
          <div class="ds-field">
            <label class="ds-label" for="password">Senha</label>
            <input class="ds-control" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          </div>
          <button type="submit" class="ds-btn ds-btn--primary ds-btn--lg">Entrar</button>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
