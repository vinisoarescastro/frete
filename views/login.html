<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232457d6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M1 6h13v10H1zM14 10h4l4 4v2h-8z'/%3E%3Ccircle cx='6' cy='18' r='2'/%3E%3Ccircle cx='18' cy='18' r='2'/%3E%3C/svg%3E">
<title>Entrar | Calculadora de Fretes</title>
<style>
  :root{--bg:#f6f7f9;--surface:#fff;--ink:#111827;--muted:#5b6472;--line:#e2e5ea;--accent:#2457d6;--on-accent:#fff;--accent-soft:#eaf0fd;--bad:#b42318;--bad-soft:#fdeceb}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b23;--ink:#eceff4;--muted:#a0a8b6;--line:#2a303b;--accent:#7aa5ff;--on-accent:#0b1220;--accent-soft:#1a2540;--bad:#ff8a80;--bad-soft:#3a1a18}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
  form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--accent);margin-bottom:18px}
  h1{font-size:20px;margin:0 0 4px;color:var(--ink)}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:14.5px}
  label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
  input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{width:100%;margin-top:16px;min-height:44px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .err{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:14px}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h13v10H1zM14 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div>
  <h1>Calculadora de Fretes</h1>
  <p class="sub">Informe a senha para continuar.</p>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  {{MSG}}
  <button type="submit">Entrar</button>
</form>
</body>
</html>
