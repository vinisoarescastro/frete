<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Calculadora de Fretes</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1a2233;--muted:#66708a;--line:#dfe4ee;--brand:#0b5fff;--bad:#c62828}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf5;--muted:#9aa5bd;--line:#2a3348;--bad:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit}
  input:focus{outline:2px solid var(--brand);outline-offset:1px}
  button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{margin:14px 0 0;color:var(--bad);font-size:14px}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>Calculadora de Fretes</h1>
  <p class="sub">Acesso restrito. Informe a senha para continuar.</p>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  {{MSG}}
  <button type="submit">Entrar</button>
</form>
</body>
</html>
